# Пример inventory для схемы svcsecadmin → svcsec
# Документация: docs/ansible-svcsec-svcsecadmin.md
#
# Запуск с control node:
#   sudo -u svcsecadmin -H ansible -i ansible-svcsec-inventory.example.ini servers -m ping

[servers]
# node1.example.ru
# node2.example.ru
# 192.168.0.100

[servers:vars]
ansible_user=svcsec
ansible_become=true
ansible_become_method=sudo
ansible_become_user=root
# Раскомментируйте нужный путь к ключу оператора:
# ansible_ssh_private_key_file=/home/svcsecadmin/.ssh/id_ed25519
# ansible_ssh_private_key_file=/var/lib/ansible-keys/id_ed25519
